name: Publish addon Beta 14 guide mode

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-beta14-guide-mode.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ENTRY_B64: 
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4 zip rsync

      - name: Prepend Beta 14 changelog
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import base64,pathlib,os; p=pathlib.Path("CHANGELOG.md"); old=p.read_text(encoding="utf-8"); old=old[len("# Azeroth Questing Changelog\n"):] if old.startswith("# Azeroth Questing Changelog\n") else old; p.write_text(base64.b64decode(os.environ["ENTRY_B64"]).decode("utf-8") + old.lstrip("\n"), encoding="utf-8")'

      - name: Validate Beta 14
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.lua' -not -path './.git/*' -print0 | xargs -0 -n1 luac -p
          git diff --check
          grep -q '^## Interface: 120100$' AzerothQuesting.toc
          grep -q '^## Version: 0.3.0-beta.14$' AzerothQuesting.toc
          grep -q '^GuideMode.lua$' AzerothQuesting.toc
          grep -q '^\*\*VERSION 0.3.0 Beta 14 - September 11, 2026 - Available on GitHub Pre-release\*\*$' CHANGELOG.md

      - name: Commit release changelog
        id: release_commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m 'Release addon v0.3.0-beta.14'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build packages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package AzerothQuesting.zip AzerothQuesting-0.3.0-beta.14.zip
          mkdir -p package/AzerothQuesting
          rsync -a --exclude='.git' --exclude='.github' --exclude='package' --exclude='*.zip' ./ package/AzerothQuesting/
          (cd package && zip -qr ../AzerothQuesting.zip AzerothQuesting)
          cp AzerothQuesting.zip AzerothQuesting-0.3.0-beta.14.zip
          awk -v version='0.3.0 Beta 14' 'BEGIN{found=0} /^\*\*VERSION /{if(found)exit; prefix="**VERSION " version " -"; if(index($0,prefix)==1)found=1} found{if($0=="---")exit; print}' CHANGELOG.md > release-notes-0.3.0-beta.14.md
          test -s release-notes-0.3.0-beta.14.md

      - name: Publish GitHub Pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release_commit.outputs.sha }}
        run: |
          set -euo pipefail
          TAG='addon-v0.3.0-beta.14'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes-0.3.0-beta.14.md
          else
            gh release create "$TAG" --target "$RELEASE_SHA" --title 'Azeroth Questing v0.3.0-beta.14' --notes-file release-notes-0.3.0-beta.14.md --prerelease
          fi
          gh release upload "$TAG" AzerothQuesting.zip AzerothQuesting-0.3.0-beta.14.zip --clobber

      - name: Remove temporary publisher
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          rm -f .github/workflows/publish-beta14-guide-mode.yml
          git add -u .github/workflows/publish-beta14-guide-mode.yml
          git commit -m 'Remove Beta 14 guide-mode publisher'
          git push origin HEAD:main
