name: Prepare addon Beta 5 Companion completed quest handoff

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/prepare-completed-quest-client-beta5.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare Beta 5 metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path

          entry = base64.b64decode('').decode('utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          heading = '# Azeroth Questing Changelog\n\n'
          if not changelog.startswith(heading):
              raise SystemExit('Unexpected addon changelog heading')
          if '**VERSION 0.3.0 Beta 5 -' not in changelog:
              changelog = heading + entry + changelog[len(heading):]
              changelog_path.write_text(changelog, encoding='utf-8')

          toc_path = Path('AzerothQuesting.toc')
          toc = toc_path.read_text(encoding='utf-8')
          toc = toc.replace('## Version: 0.3.0-beta.4', '## Version: 0.3.0-beta.5', 1)
          if '## SavedVariablesPerCharacter: AzerothQuestingCharacterDB' not in toc:
              toc = toc.replace('## SavedVariables: ZoneQuestGuideDB\n', '## SavedVariables: ZoneQuestGuideDB\n## SavedVariablesPerCharacter: AzerothQuestingCharacterDB\n', 1)
          if 'CompletedQuestClient.lua' not in toc:
              toc = toc.replace('CompletedQuestReport.lua\n', 'CompletedQuestReport.lua\nCompletedQuestClient.lua\n', 1)
          toc_path.write_text(toc, encoding='utf-8')
          PY

      - name: Commit addon Beta 5
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md AzerothQuesting.toc
          if git diff --cached --quiet; then
            echo 'No Beta 5 metadata changes were needed.'
            exit 0
          fi
          git commit -m 'Release addon v0.3.0-beta.5 Companion completed quest handoff'
          git push origin HEAD:main
