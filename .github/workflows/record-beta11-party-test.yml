name: Record Beta 11 cross-faction party test

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  record:
    if: github.event.head_commit.message == 'Record Beta 11 cross-faction party test helper'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Record verified in-game PARTY test
        shell: python
        run: |
          from pathlib import Path
          p = Path('CHANGELOG.md')
          text = p.read_text(encoding='utf-8')
          marker = '* **Verified in World of Warcraft** that Beta 11 loads again on live Retail and that the **GUILD** transport works bidirectionally across both faction and realm boundaries.'
          start = text.index(marker)
          end = text.index('\n\n---', start)
          old = text[start:end]
          new = old + '\n\n* **Verified in World of Warcraft** that the **PARTY** transport also works across both faction and realm boundaries in the tested Alliance-to-Horde direction. With the Alliance client grouped with `Moralni-Bonechewer` on a different realm and running `0.3.0-beta.11`, **Connected Players** showed **1 player** with a fresh Last Seen value. This confirms live cross-faction + cross-realm PARTY peer discovery from the Alliance client. The reverse Horde-to-Alliance direction has not yet been separately evidenced, so bidirectional cross-faction PARTY is not claimed yet.'
          p.write_text(text[:start] + new + text[end:], encoding='utf-8')

      - name: Commit test record and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/record-beta11-party-test.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md .github/workflows/record-beta11-party-test.yml
          git commit -m 'Record Beta 11 cross-faction PARTY test'
          git push

      - name: Synchronize Beta 11 GitHub Pre-release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git pull --ff-only
          awk '
            BEGIN { found = 0 }
            /^\*\*VERSION 0\.3\.0 Beta 11 -/ { found = 1 }
            found {
              if ($0 == "---") exit
              print
            }
          ' CHANGELOG.md > beta11-notes.md
          gh release edit addon-v0.3.0-beta.11 --notes-file beta11-notes.md
