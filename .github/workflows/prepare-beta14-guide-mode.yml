name: Prepare addon Beta 14 guide mode

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/prepare-beta14-guide-mode.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4 zip rsync

      - name: Add Zygor-style Guide Mode and bump Beta 14
        shell: bash
        run: |
          set -euo pipefail

          cat > GuideMode.lua <<'LUA'
local ADDON_NAME, ZQG = ...

local mainFrame = _G.ZoneQuestGuideFrame
if not mainFrame then
    return
end

local currentQuestID
local currentIndex = 1
local lastWaypointKey
local updateScheduled = false
local forceWaypointOnUpdate = false

local function GetDB()
    ZoneQuestGuideDB = ZoneQuestGuideDB or {}
    return ZoneQuestGuideDB
end

local function Print(msg)
    DEFAULT_CHAT_FRAME:AddMessage("|cff66ccffAzeroth Questing:|r " .. tostring(msg))
end

local function AccessibleString(value)
    if value == nil then
        return nil
    end
    if canaccessvalue and not canaccessvalue(value) then
        return nil
    end
    if type(value) ~= "string" then
        return nil
    end
    return value
end

local function CurrentMapID()
    if C_Map and C_Map.GetBestMapForUnit then
        local ok, mapID = pcall(C_Map.GetBestMapForUnit, "player")
        if ok then
            return mapID
        end
    end
    return nil
end

local function ViewName()
    return GetDB().questFrequencyView == "repeatable" and "Daily / Weekly" or "Zone Quests"
end

local function QuestStatusKey(quest)
    if ZQG.GetQuestStatusKey then
        local ok, status = pcall(ZQG.GetQuestStatusKey, quest)
        if ok and status then
            return status
        end
    end
    return quest and quest.accepted and "progress" or "available"
end

local function QuestStatusText(quest)
    if ZQG.GetQuestStatusText then
        local ok, text = pcall(ZQG.GetQuestStatusText, quest)
        if ok and text then
            return text
        end
    end
    return quest and quest.accepted
        and "|cff66ff66IN PROGRESS|r"
        or "|cffffff66AVAILABLE|r"
end

local function QuestFrequencyBadge(quest)
    if ZQG.GetQuestFrequencyBadge then
        local ok, text = pcall(ZQG.GetQuestFrequencyBadge, quest)
        if ok and text then
            return text
        end
    end
    return ""
end

local function CategoryPriority(quest)
    if ZQG.GetQuestCategoryPriority then
        local ok, value = pcall(ZQG.GetQuestCategoryPriority, quest)
        if ok and type(value) == "number" then
            return value
        end
    end
    return 1
end

local function StatusPriority(quest)
    if ZQG.GetQuestStatusPriority then
        local ok, value = pcall(ZQG.GetQuestStatusPriority, quest)
        if ok and type(value) == "number" then
            return value
        end
    end
    return quest and quest.accepted and 2 or 1
end

local function GetQuestRows()
    local rows = {}
    for _, child in ipairs({ mainFrame:GetChildren() }) do
        if child.GetObjectType and child:GetObjectType() == "Button"
            and child.text and child.text.SetText then
            local width, height = child:GetSize()
            if math.abs((width or 0) - 330) < 1 and math.abs((height or 0) - 25) < 1 then
                rows[#rows + 1] = child
            end
        end
    end

    table.sort(rows, function(a, b)
        local _, _, _, _, ay = a:GetPoint(1)
        local _, _, _, _, by = b:GetPoint(1)
        return (ay or 0) > (by or 0)
    end)
    return rows
end

local function GetGuideQuests()
    local source
    if ZQG.GetDisplayQuests then
        local ok, quests = pcall(ZQG.GetDisplayQuests)
        if ok and type(quests) == "table" then
            source = quests
        end
    end

    local quests = {}
    if source then
        for _, quest in ipairs(source) do
            if quest then
                quests[#quests + 1] = quest
            end
        end
    else
        for _, row in ipairs(GetQuestRows()) do
            if row.quest then
                quests[#quests + 1] = row.quest
            end
        end
    end

    table.sort(quests, function(a, b)
        local ac, bc = CategoryPriority(a), CategoryPriority(b)
        if ac ~= bc then
            return ac < bc
        end

        local ap, bp = StatusPriority(a), StatusPriority(b)
        if ap ~= bp then
            return ap < bp
        end

        local ad = a.distance2 or math.huge
        local bd = b.distance2 or math.huge
        if ad ~= bd then
            return ad < bd
        end

        return (a.id or 0) < (b.id or 0)
    end)

    return quests
end

local function FindQuestIndex(quests, questID)
    if not questID then
        return nil
    end
    for index, quest in ipairs(quests) do
        if quest.id == questID then
            return index
        end
    end
    return nil
end

local function ObjectiveLinesFromModernAPI(questID)
    if not C_QuestLog or not C_QuestLog.GetQuestObjectives then
        return nil
    end

    local ok, objectives = pcall(C_QuestLog.GetQuestObjectives, questID)
    if not ok or type(objectives) ~= "table" then
        return nil
    end

    local lines = {}
    for _, objective in ipairs(objectives) do
        local text = AccessibleString(objective and objective.text)
        if text and text ~= "" then
            local marker = objective.finished and "|cff66ff66✓|r " or "• "
            lines[#lines + 1] = marker .. text
            if #lines >= 4 then
                break
            end
        end
    end

    return #lines > 0 and lines or nil
end

local function ObjectiveLinesFromLegacyAPI(questID)
    if not C_QuestLog or not C_QuestLog.GetLogIndexForQuestID
        or not GetNumQuestLeaderBoards or not GetQuestLogLeaderBoard then
        return nil
    end

    local indexOK, logIndex = pcall(C_QuestLog.GetLogIndexForQuestID, questID)
    if not indexOK or not logIndex or logIndex <= 0 then
        return nil
    end

    local countOK, count = pcall(GetNumQuestLeaderBoards, logIndex)
    if not countOK or type(count) ~= "number" or count <= 0 then
        return nil
    end

    local lines = {}
    for objectiveIndex = 1, math.min(count, 4) do
        local ok, text, _, finished = pcall(GetQuestLogLeaderBoard, objectiveIndex, logIndex)
        text = ok and AccessibleString(text) or nil
        if text and text ~= "" then
            lines[#lines + 1] = (finished and "|cff66ff66✓|r " or "• ") .. text
        end
    end

    return #lines > 0 and lines or nil
end

local function BuildInstruction(quest)
    local status = QuestStatusKey(quest)
    if status == "available" then
        return "Pick up this quest."
    elseif status == "turnin" then
        return "|cffffcc00Quest complete.|r Return to the quest giver and turn it in."
    end

    local lines = ObjectiveLinesFromModernAPI(quest.id)
        or ObjectiveLinesFromLegacyAPI(quest.id)
    if lines then
        return table.concat(lines, "\n")
    end

    return "Complete this quest's objectives."
end

local frame = CreateFrame("Frame", "AzerothQuestingGuideModeFrame", UIParent, "BackdropTemplate")
frame:SetSize(410, 260)
frame:SetPoint("RIGHT", UIParent, "RIGHT", -42, 70)
frame:SetFrameStrata("HIGH")
frame:SetClampedToScreen(true)
frame:EnableMouse(true)
frame:SetMovable(true)
frame:RegisterForDrag("LeftButton")
frame:SetBackdrop({
    bgFile = "Interface\\DialogFrame\\UI-DialogBox-Background-Dark",
    edgeFile = "Interface\\Tooltips\\UI-Tooltip-Border",
    tile = true,
    tileSize = 16,
    edgeSize = 16,
    insets = { left = 4, right = 4, top = 4, bottom = 4 },
})
frame:Hide()

local title = frame:CreateFontString(nil, "OVERLAY", "GameFontNormalLarge")
title:SetPoint("TOPLEFT", 16, -14)
title:SetText("Azeroth Questing Guide")

local close = CreateFrame("Button", nil, frame, "UIPanelCloseButton")
close:SetPoint("TOPRIGHT", -3, -3)
close:SetScript("OnClick", function()
    GetDB().guideModeEnabled = false
    frame:Hide()
end)

local stepText = frame:CreateFontString(nil, "OVERLAY", "GameFontHighlightSmall")
stepText:SetPoint("TOPLEFT", title, "BOTTOMLEFT", 0, -7)
stepText:SetWidth(250)
stepText:SetJustifyH("LEFT")

local viewButton = CreateFrame("Button", nil, frame, "UIPanelButtonTemplate")
viewButton:SetSize(132, 23)
viewButton:SetPoint("TOPRIGHT", frame, "TOPRIGHT", -34, -40)

local statusText = frame:CreateFontString(nil, "OVERLAY", "GameFontNormal")
statusText:SetPoint("TOPLEFT", stepText, "BOTTOMLEFT", 0, -16)
statusText:SetWidth(360)
statusText:SetJustifyH("LEFT")

local questText = frame:CreateFontString(nil, "OVERLAY", "GameFontNormalLarge")
questText:SetPoint("TOPLEFT", statusText, "BOTTOMLEFT", 0, -6)
questText:SetWidth(376)
questText:SetJustifyH("LEFT")
questText:SetWordWrap(true)

local instructionText = frame:CreateFontString(nil, "OVERLAY", "GameFontHighlight")
instructionText:SetPoint("TOPLEFT", questText, "BOTTOMLEFT", 0, -10)
instructionText:SetWidth(376)
instructionText:SetHeight(86)
instructionText:SetJustifyH("LEFT")
instructionText:SetJustifyV("TOP")
instructionText:SetWordWrap(true)

local backButton = CreateFrame("Button", nil, frame, "UIPanelButtonTemplate")
backButton:SetSize(78, 24)
backButton:SetPoint("BOTTOMLEFT", 16, 18)
backButton:SetText("< Back")

local nextButton = CreateFrame("Button", nil, frame, "UIPanelButtonTemplate")
nextButton:SetSize(78, 24)
nextButton:SetPoint("LEFT", backButton, "RIGHT", 8, 0)
nextButton:SetText("Next >")

local listButton = CreateFrame("Button", nil, frame, "UIPanelButtonTemplate")
listButton:SetSize(96, 24)
listButton:SetPoint("LEFT", nextButton, "RIGHT", 8, 0)
listButton:SetText("Quest List")

local note = frame:CreateFontString(nil, "OVERLAY", "GameFontDisableSmall")
note:SetPoint("BOTTOMRIGHT", -14, 23)
note:SetWidth(110)
note:SetJustifyH("RIGHT")
note:SetText("/aq guide")

local function SavePosition()
    local point, _, relativePoint, x, y = frame:GetPoint(1)
    GetDB().guideModePosition = {
        point = point,
        relativePoint = relativePoint,
        x = x,
        y = y,
    }
end

frame:SetScript("OnDragStart", function(self)
    self:StartMoving()
end)
frame:SetScript("OnDragStop", function(self)
    self:StopMovingOrSizing()
    SavePosition()
end)

local function SelectQuestAt(index, quests, forceWaypoint)
    quests = quests or GetGuideQuests()
    if #quests == 0 then
        currentQuestID = nil
        currentIndex = 1
        lastWaypointKey = nil
        return nil
    end

    index = math.max(1, math.min(index or 1, #quests))
    currentIndex = index
    currentQuestID = quests[index].id
    if forceWaypoint then
        lastWaypointKey = nil
    end
    return quests[index]
end

local function UpdateGuide(forceWaypoint)
    local DB = GetDB()
    if DB.guideModeEnabled == false then
        frame:Hide()
        return
    end

    frame:Show()

    local quests = GetGuideQuests()
    local view = ViewName()
    viewButton:SetText(DB.questFrequencyView == "repeatable" and "Show Zone Quests" or "Show Daily / Weekly")

    if #quests == 0 then
        currentQuestID = nil
        currentIndex = 1
        lastWaypointKey = nil
        stepText:SetText(view .. "  •  no steps")
        statusText:SetText("|cffaaaaaaNO UNFINISHED QUESTS|r")
        questText:SetText("You're caught up in this tab")
        instructionText:SetText("Switch tabs or move to another questing area to continue.")
        backButton:Disable()
        nextButton:Disable()
        return
    end

    local index = FindQuestIndex(quests, currentQuestID)
    if not index then
        index = math.max(1, math.min(currentIndex or 1, #quests))
        SelectQuestAt(index, quests, true)
    else
        currentIndex = index
    end

    local quest = quests[currentIndex]
    currentQuestID = quest.id

    stepText:SetText(string.format("%s  •  Step %d of %d", view, currentIndex, #quests))
    statusText:SetText(QuestStatusText(quest))

    local badge = QuestFrequencyBadge(quest)
    if quest.isCampaign then
        badge = badge .. " [Campaign]"
    elseif quest.isLocalStory then
        badge = badge .. " [Local Story]"
    end
    questText:SetText((quest.name or ("Quest " .. tostring(quest.id or ""))) .. badge)
    instructionText:SetText(BuildInstruction(quest))

    if currentIndex > 1 then
        backButton:Enable()
    else
        backButton:Disable()
    end
    if currentIndex < #quests then
        nextButton:Enable()
    else
        nextButton:Disable()
    end

    local waypointKey = table.concat({
        tostring(quest.id or 0),
        QuestStatusKey(quest),
        tostring(CurrentMapID() or 0),
    }, ":")

    if forceWaypoint or waypointKey ~= lastWaypointKey then
        lastWaypointKey = waypointKey
        if ZQG.SetWaypointForQuest then
            pcall(ZQG.SetWaypointForQuest, quest)
        end
    end
end

local function ScheduleGuideUpdate(forceWaypoint)
    forceWaypointOnUpdate = forceWaypointOnUpdate or forceWaypoint
    if updateScheduled then
        return
    end

    updateScheduled = true
    C_Timer.After(0.4, function()
        updateScheduled = false
        local force = forceWaypointOnUpdate
        forceWaypointOnUpdate = false
        UpdateGuide(force)
    end)
end

backButton:SetScript("OnClick", function()
    local quests = GetGuideQuests()
    if #quests > 0 then
        SelectQuestAt((FindQuestIndex(quests, currentQuestID) or currentIndex or 1) - 1, quests, true)
        UpdateGuide(true)
    end
end)

nextButton:SetScript("OnClick", function()
    local quests = GetGuideQuests()
    if #quests > 0 then
        SelectQuestAt((FindQuestIndex(quests, currentQuestID) or currentIndex or 1) + 1, quests, true)
        UpdateGuide(true)
    end
end)

listButton:SetScript("OnClick", function()
    local DB = GetDB()
    if mainFrame:IsShown() then
        mainFrame:Hide()
        DB.hidden = true
    else
        mainFrame:Show()
        DB.hidden = false
        if ZQG.Refresh then
            ZQG.Refresh()
        end
    end
end)

viewButton:SetScript("OnClick", function()
    local DB = GetDB()
    DB.questFrequencyView = DB.questFrequencyView == "repeatable" and "zone" or "repeatable"
    currentQuestID = nil
    currentIndex = 1
    lastWaypointKey = nil
    if ZQG.Refresh then
        ZQG.Refresh()
    end
    ScheduleGuideUpdate(true)
end)

local function HookQuestRows()
    for _, row in ipairs(GetQuestRows()) do
        if not row.ZQGGuideModeHooked then
            row.ZQGGuideModeHooked = true
            row:HookScript("OnClick", function(self)
                if self.quest then
                    currentQuestID = self.quest.id
                    local quests = GetGuideQuests()
                    currentIndex = FindQuestIndex(quests, currentQuestID) or 1
                    lastWaypointKey = nil
                    ScheduleGuideUpdate(true)
                end
            end)
        end
    end
end

local originalRefresh = ZQG.Refresh
if originalRefresh then
    ZQG.Refresh = function(...)
        local result = originalRefresh(...)
        HookQuestRows()
        ScheduleGuideUpdate(false)
        return result
    end
end

mainFrame:HookScript("OnShow", function()
    HookQuestRows()
    ScheduleGuideUpdate(false)
end)

local events = CreateFrame("Frame")
events:RegisterEvent("ADDON_LOADED")
events:RegisterEvent("PLAYER_ENTERING_WORLD")
events:RegisterEvent("ZONE_CHANGED_NEW_AREA")
events:RegisterEvent("ZONE_CHANGED")
events:RegisterEvent("QUEST_ACCEPTED")
events:RegisterEvent("QUEST_REMOVED")
events:RegisterEvent("QUEST_TURNED_IN")
events:RegisterEvent("QUEST_LOG_UPDATE")
events:RegisterEvent("QUESTLINE_UPDATE")
events:RegisterEvent("GOSSIP_SHOW")
events:RegisterEvent("QUEST_DETAIL")
events:SetScript("OnEvent", function(_, event, arg1)
    if event == "ADDON_LOADED" then
        if arg1 ~= ADDON_NAME then
            return
        end

        local DB = GetDB()
        if DB.guideModeEnabled == nil then
            DB.guideModeEnabled = true
        end
        if DB.guideModePosition then
            frame:ClearAllPoints()
            frame:SetPoint(
                DB.guideModePosition.point or "RIGHT",
                UIParent,
                DB.guideModePosition.relativePoint or "RIGHT",
                DB.guideModePosition.x or -42,
                DB.guideModePosition.y or 70
            )
        end
        HookQuestRows()
        ScheduleGuideUpdate(true)
        return
    end

    ScheduleGuideUpdate(event == "QUEST_ACCEPTED" or event == "QUEST_TURNED_IN")
end)

function ZQG.ShowGuideMode()
    local DB = GetDB()
    DB.guideModeEnabled = true
    frame:Show()
    HookQuestRows()
    ScheduleGuideUpdate(true)
end

function ZQG.HideGuideMode()
    GetDB().guideModeEnabled = false
    frame:Hide()
end

function ZQG.ToggleGuideMode()
    if frame:IsShown() then
        ZQG.HideGuideMode()
    else
        ZQG.ShowGuideMode()
    end
end

function ZQG.GuideNext()
    nextButton:Click()
end

function ZQG.GuideBack()
    backButton:Click()
end

local previousSlashHandler = SlashCmdList.ZONEQUESTGUIDE
SlashCmdList.ZONEQUESTGUIDE = function(msg)
    local command = (msg or ""):lower():match("^%s*(.-)%s*$")

    if command == "guide" then
        ZQG.ToggleGuideMode()
        return
    elseif command == "guide on" or command == "guide show" then
        ZQG.ShowGuideMode()
        return
    elseif command == "guide off" or command == "guide hide" then
        ZQG.HideGuideMode()
        return
    elseif command == "guide next" then
        ZQG.GuideNext()
        return
    elseif command == "guide back" or command == "guide previous" then
        ZQG.GuideBack()
        return
    end

    if previousSlashHandler then
        previousSlashHandler(msg)
    end
end

HookQuestRows()
ScheduleGuideUpdate(false)
LUA

          python3 <<'PY'
from pathlib import Path

core = Path('Core.lua')
text = core.read_text(encoding='utf-8')
needle = 'ZQG.Refresh = Refresh\nZQG.SetWaypointForQuest = SetWaypointForQuest\n'
replacement = 'ZQG.Refresh = Refresh\nZQG.SetWaypointForQuest = SetWaypointForQuest\nZQG.GetDisplayQuests = GetDisplayQuests\n'
if 'ZQG.GetDisplayQuests = GetDisplayQuests' not in text:
    if needle not in text:
        raise SystemExit('Core export insertion point not found')
    text = text.replace(needle, replacement, 1)
core.write_text(text, encoding='utf-8')

toc = Path('AzerothQuesting.toc')
text = toc.read_text(encoding='utf-8')
text = text.replace('## Version: 0.3.0-beta.13', '## Version: 0.3.0-beta.14', 1)
if 'GuideMode.lua' not in text:
    marker = 'PhaseGuidance.lua\nSlashDiagnostics.lua\n'
    if marker not in text:
        raise SystemExit('TOC GuideMode insertion point not found')
    text = text.replace(marker, 'PhaseGuidance.lua\nGuideMode.lua\nSlashDiagnostics.lua\n', 1)
toc.write_text(text, encoding='utf-8')

changelog = Path('CHANGELOG.md')
old = changelog.read_text(encoding='utf-8')
entry = '''# Azeroth Questing Changelog\n\n**VERSION 0.3.0 Beta 14 - September 11, 2026 - Available on GitHub Pre-release**\n\n* **Added** an optional Zygor-style **Guide Mode** that presents one quest step at a time instead of requiring the player to work from the full zone list. The compact guide shows the current quest, its live status, up to four objective lines when WoW exposes them, and a simple instruction to pick up, complete, or turn in the quest.\n\n* **Added** automatic step progression. Guide Mode stays on the same quest as it moves from **AVAILABLE** to **IN PROGRESS** to **TURN IN**, then advances to the next unfinished quest after the completed quest leaves the active list. Completed quests are skipped by the existing completion/prerequisite filtering.\n\n* **Added** **Back**, **Next**, **Quest List**, and **Show Zone Quests / Show Daily / Weekly** controls so players can move through the guide manually, reopen the full quest list, or switch the Beta 13 frequency view without leaving Guide Mode. Manual quest-row selection also synchronizes the compact guide target.\n\n* **Improved** navigation integration by routing Guide Mode targets through the existing Azeroth Questing waypoint/navigation HUD pipeline. Accepted quests use WoW quest super-tracking; known unaccepted quest coordinates continue to use the addon's waypoint arrow behavior.\n\n* **Added** `/aq guide`, `/aq guide on`, `/aq guide off`, `/aq guide next`, and `/aq guide back` controls. Guide Mode is enabled by default for new/upgraded Beta 14 settings and remembers its screen position and whether the player closes it.\n\n* **Kept** the Azeroth Questing Network protocol, research payloads, Companion handoff, Website behavior, and Azeroth Questing Server schema unchanged. No Companion, Website, or server build is required for this addon-only guide-view change.\n\n*Beta 14 still requires in-game validation. Verify Guide Mode opens without Lua errors, follows an available quest through accept/objectives/turn-in, automatically advances after turn-in, Back/Next and the Zone vs Daily/Weekly switch work, the Quest List button remains usable, and the existing navigation HUD points to the selected guide step. No successful Beta 14 in-game test is claimed yet.*\n\n---\n\n'''
if old.startswith('# Azeroth Questing Changelog\n'):
    old = old[len('# Azeroth Questing Changelog\n'):]
changelog.write_text(entry + old.lstrip('\n'), encoding='utf-8')
