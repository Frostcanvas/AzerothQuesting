      - name: Validate addon sources
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.lua' -not -path './.git/*' -print0 | xargs -0 -n1 luac -p
          git diff --check
          grep -q '^## Interface: 120100$' AzerothQuesting.toc
          grep -q '^## Version: 0.3.0-beta.14$' AzerothQuesting.toc
          grep -q '^GuideMode.lua$' AzerothQuesting.toc
          grep -q '^\*\*VERSION 0.3.0 Beta 14 - September 11, 2026 - Available on GitHub Pre-release\*\*$' CHANGELOG.md

      - name: Commit Beta 14
        id: release_commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add GuideMode.lua Core.lua AzerothQuesting.toc CHANGELOG.md
          git commit -m 'Release addon v0.3.0-beta.14'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Beta 14 packages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package AzerothQuesting.zip AzerothQuesting-0.3.0-beta.14.zip
          mkdir -p package/AzerothQuesting
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='package' \
            --exclude='*.zip' \
            ./ package/AzerothQuesting/
          (cd package && zip -qr ../AzerothQuesting.zip AzerothQuesting)
          cp AzerothQuesting.zip AzerothQuesting-0.3.0-beta.14.zip

          awk -v version='0.3.0 Beta 14' '
            BEGIN { found = 0 }
            /^\*\*VERSION / {
              if (found) exit
              prefix = "**VERSION " version " -"
              if (index($0, prefix) == 1) found = 1
            }
            found {
              if ($0 == "---") exit
              print
            }
          ' CHANGELOG.md > release-notes-0.3.0-beta.14.md
          test -s release-notes-0.3.0-beta.14.md

      - name: Publish Beta 14 GitHub Pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release_commit.outputs.sha }}
        run: |
          set -euo pipefail
          TAG='addon-v0.3.0-beta.14'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes-0.3.0-beta.14.md
          else
            gh release create "$TAG" \
              --target "$RELEASE_SHA" \
              --title 'Azeroth Questing v0.3.0-beta.14' \
              --notes-file release-notes-0.3.0-beta.14.md \
              --prerelease
          fi
          gh release upload "$TAG" AzerothQuesting.zip AzerothQuesting-0.3.0-beta.14.zip --clobber

      - name: Remove temporary helper
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          rm -f .github/workflows/prepare-beta14-guide-mode.yml
          git add -u .github/workflows/prepare-beta14-guide-mode.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Remove Beta 14 guide-mode publisher'
            git push origin HEAD:main
          fi
