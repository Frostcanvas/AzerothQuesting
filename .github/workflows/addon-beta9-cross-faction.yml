name: Prepare addon Beta 9 cross-faction network

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/addon-beta9-cross-faction.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Prepare addon Beta 9 cross-faction network helper'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Apply Beta 9 network changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          network_path = Path('AzerothNetwork.lua')
          text = network_path.read_text(encoding='utf-8')

          text = text.replace(
              'local MAX_PEER_ROWS = 12\n',
              'local MAX_PEER_ROWS = 12\n'
              'local INBOUND_DEDUP_WINDOW = 10\n\n'
              'local VALID_NETWORK_CHANNELS = {\n'
              '    CHANNEL = true,\n'
              '    PARTY = true,\n'
              '    RAID = true,\n'
              '    INSTANCE_CHAT = true,\n'
              '    GUILD = true,\n'
              '}\n',
              1,
          )
          text = text.replace(
              'local peerRows = {}\n',
              'local peerRows = {}\nlocal recentInbound = {}\nlocal lastInboundPrune = 0\n',
              1,
          )

          replacement = r'''local function InInstanceGroup()
              if not IsInGroup or not LE_PARTY_CATEGORY_INSTANCE then
                  return false
              end
              local ok, grouped = pcall(IsInGroup, LE_PARTY_CATEGORY_INSTANCE)
              return ok and grouped and true or false
          end

          local function InRaid()
              if not IsInRaid then
                  return false
              end
              local ok, grouped = pcall(IsInRaid)
              return ok and grouped and true or false
          end

          local function InGroup()
              if not IsInGroup then
                  return false
              end
              local ok, grouped = pcall(IsInGroup)
              return ok and grouped and true or false
          end

          local function InGuild()
              if not IsInGuild then
                  return false
              end
              local ok, guilded = pcall(IsInGuild)
              return ok and guilded and true or false
          end

          local function CurrentGroupTransport()
              if InInstanceGroup() then
                  return "INSTANCE_CHAT"
              elseif InRaid() then
                  return "RAID"
              elseif InGroup() then
                  return "PARTY"
              end
              return nil
          end

          local function QueueTransport(key, message, chatType)
              local transportKey = key .. "@" .. chatType
              if pendingKeys[transportKey] then
                  return false
              end
              if #pending >= MAX_PENDING then
                  return false
              end
              pending[#pending + 1] = {
                  key = transportKey,
                  message = message,
                  chatType = chatType,
                  channelWaits = 0,
              }
              pendingKeys[transportKey] = true
              return true
          end

          local function QueueMessage(key, message)
              local queued = false
              local groupTransport = CurrentGroupTransport()

              -- Cross-faction-capable shared contexts are queued first so a
              -- throttled custom channel cannot delay party/raid/instance peers.
              if groupTransport then
                  queued = QueueTransport(key, message, groupTransport) or queued
              end
              if InGuild() then
                  queued = QueueTransport(key, message, "GUILD") or queued
              end

              -- Preserve the existing broad same-faction custom-channel path.
              queued = QueueTransport(key, message, "CHANNEL") or queued
              return queued
          end

          local function TransportAvailable(chatType)
              if chatType == "CHANNEL" then
                  return RefreshChannelID() > 0
              elseif chatType == "INSTANCE_CHAT" then
                  return InInstanceGroup()
              elseif chatType == "RAID" then
                  return InRaid()
              elseif chatType == "PARTY" then
                  return InGroup() and not InRaid() and not InInstanceGroup()
              elseif chatType == "GUILD" then
                  return InGuild()
              end
              return false
          end

          local function SendRaw(message, chatType)
              if not prefixRegistered or OutgoingRestricted() then
                  return false
              end
              if not C_ChatInfo or not C_ChatInfo.SendAddonMessage then
                  return false
              end

              local target = nil
              if chatType == "CHANNEL" then
                  target = RefreshChannelID()
                  if target <= 0 then
                      JoinNetworkChannel()
                      lastSendResult = 7
                      return false
                  end
              elseif not TransportAvailable(chatType) then
                  lastSendResult = chatType == "GUILD" and 10 or 5
                  return false
              end

              local ok, result
              if target then
                  ok, result = pcall(C_ChatInfo.SendAddonMessage, PREFIX, message, chatType, target)
              else
                  ok, result = pcall(C_ChatInfo.SendAddonMessage, PREFIX, message, chatType)
              end
              if not ok then
                  lastSendResult = 9
                  return false
              end

              lastSendResult = result
              if result == 0 then
                  sentCount = sentCount + 1
                  return true
              end
              return false
          end

          local function SendHello()'''

          text, count = re.subn(
              r'local function QueueMessage\(key, message\).*?\nend\n\nlocal function SendRaw\(message\).*?\nend\n\nlocal function SendHello\(\)',
              replacement,
              text,
              count=1,
              flags=re.S,
          )
          assert count == 1, 'Could not replace queue/send transport block'

          replacement = r'''local function DropPendingFront()
              local item = table.remove(pending, 1)
              if item then
                  pendingKeys[item.key] = nil
              end
          end

          local function ProcessPending()
              if #pending == 0 then
                  return
              end
              if OutgoingRestricted() then
                  return
              end

              local item = pending[1]
              if item.chatType == "CHANNEL" and RefreshChannelID() <= 0 then
                  item.channelWaits = (item.channelWaits or 0) + 1
                  JoinNetworkChannel()
                  if item.channelWaits >= 5 then
                      DropPendingFront()
                  end
                  return
              end

              if not TransportAvailable(item.chatType) then
                  DropPendingFront()
                  return
              end

              if SendRaw(item.message, item.chatType) then
                  DropPendingFront()
              elseif lastSendResult ~= 3 and lastSendResult ~= 8 and lastSendResult ~= 11 then
                  -- Keep throttle/lockdown failures queued for retry. Membership,
                  -- invalid-target, and other permanent failures are dropped so
                  -- one stale transport cannot block later research traffic.
                  DropPendingFront()
              end
          end'''
          text, count = re.subn(
              r'local function ProcessPending\(\).*?\nend\n\nlocal function ParseHello',
              replacement + '\n\nlocal function ParseHello',
              text,
              count=1,
              flags=re.S,
          )
          assert count == 1, 'Could not replace ProcessPending'

          marker = 'local function RefreshPeerPanel()\n'
          transport_summary = r'''local function ActiveTransportSummary()
              local transports = {}
              local groupTransport = CurrentGroupTransport()
              local id = RefreshChannelID()

              if groupTransport then
                  transports[#transports + 1] = groupTransport
              end
              if InGuild() then
                  transports[#transports + 1] = "GUILD"
              end
              if id > 0 then
                  transports[#transports + 1] = "CHANNEL /" .. tostring(id)
              else
                  transports[#transports + 1] = "CHANNEL pending"
              end

              return table.concat(transports, ", ")
          end

          '''
          assert marker in text, 'RefreshPeerPanel marker missing'
          text = text.replace(marker, transport_summary + marker, 1)

          old_status = '''    local id = RefreshChannelID()\n    local active = ActivePeerCount(now)\n    local total = #peers\n\n    peerPanel.status:SetText(string.format(\n        "AZQUEST: %s   |   Channel: %s   |   Active peers: %d   |   Seen this session: %d",\n        prefixRegistered and "registered" or "not registered",\n        id > 0 and ("joined /" .. tostring(id)) or "not joined",\n        active,\n        total\n    ))'''
          new_status = '''    local active = ActivePeerCount(now)\n    local total = #peers\n\n    peerPanel.status:SetText(string.format(\n        "AZQUEST: %s   |   Transports: %s   |   Active peers: %d   |   Seen this session: %d",\n        prefixRegistered and "registered" or "not registered",\n        ActiveTransportSummary(),\n        active,\n        total\n    ))'''
          assert old_status in text, 'Peer status block missing'
          text = text.replace(old_status, new_status, 1)
          text = text.replace(
              'subtitle:SetText("Temporary live view of AZQUEST peers detected during this WoW session.")',
              'subtitle:SetText("Live AZQUEST peers heard through the custom channel or shared party, raid, instance, and guild transports.")',
              1,
          )

          dedup = r'''local function IsDuplicateInbound(sender, text)
              if not sender then
                  return false
              end

              local now = GetTime and GetTime() or 0
              if now - lastInboundPrune >= 30 then
                  for key, seenAt in pairs(recentInbound) do
                      if now - seenAt > INBOUND_DEDUP_WINDOW then
                          recentInbound[key] = nil
                      end
                  end
                  lastInboundPrune = now
              end

              local key = sender .. "\031" .. text
              local seenAt = recentInbound[key]
              recentInbound[key] = now
              return seenAt ~= nil and now - seenAt <= INBOUND_DEDUP_WINDOW
          end

          '''
          marker = 'local function OnAddonMessage(prefix, text, channel, sender)\n'
          assert marker in text, 'OnAddonMessage marker missing'
          text = text.replace(marker, dedup + marker, 1)
          text = text.replace(
              '    if prefix ~= PREFIX or channel ~= "CHANNEL" or not text then\n        return\n    end\n    if sender and SenderIsPlayer(sender) then\n        return\n    end\n\n    receivedCount = receivedCount + 1',
              '    if prefix ~= PREFIX or not VALID_NETWORK_CHANNELS[channel] or not text then\n        return\n    end\n    if sender and SenderIsPlayer(sender) then\n        return\n    end\n    if sender and IsDuplicateInbound(sender, text) then\n        return\n    end\n\n    receivedCount = receivedCount + 1',
              1,
          )

          network_status = r'''local function NetworkStatus()
              local restricted = OutgoingRestricted()
              local now = GetTime and GetTime() or 0
              Print(string.format(
                  "Network: prefix %s %s; transports %s; queued transmissions %d; sent transmissions %d; received logical messages %d; active peers %d; peers this session %d; outgoing %s. Use /aq peers for the temporary P2P panel.",
                  PREFIX,
                  prefixRegistered and "registered" or "not registered",
                  ActiveTransportSummary(),
                  #pending,
                  sentCount,
                  receivedCount,
                  ActivePeerCount(now),
                  SessionPeerCount(),
                  restricted and "currently restricted by WoW" or "available"
              ))
          end'''
          text, count = re.subn(
              r'local function NetworkStatus\(\).*?\nend\n\nlocal events',
              network_status + '\n\nlocal events',
              text,
              count=1,
              flags=re.S,
          )
          assert count == 1, 'Could not replace NetworkStatus'

          text = text.replace(
              'events:RegisterEvent("CHANNEL_UI_UPDATE")\nevents:RegisterEvent("CHAT_MSG_ADDON")',
              'events:RegisterEvent("CHANNEL_UI_UPDATE")\nevents:RegisterEvent("GROUP_ROSTER_UPDATE")\nevents:RegisterEvent("CHAT_MSG_ADDON")',
              1,
          )
          text = text.replace(
              '    elseif event == "CHANNEL_UI_UPDATE" then\n        RefreshChannelID()\n    elseif event == "CHAT_MSG_ADDON" then',
              '    elseif event == "CHANNEL_UI_UPDATE" then\n        RefreshChannelID()\n    elseif event == "GROUP_ROSTER_UPDATE" then\n        C_Timer.After(0.5, SendHello)\n    elseif event == "CHAT_MSG_ADDON" then',
              1,
          )
          text = text.replace(
              '    if RefreshChannelID() <= 0 then\n        JoinNetworkChannel()\n        return\n    end\n    SendHello()',
              '    if RefreshChannelID() <= 0 then\n        JoinNetworkChannel()\n    end\n    SendHello()',
              1,
          )

          network_path.write_text(text, encoding='utf-8')

          settings_path = Path('Settings.lua')
          settings = settings_path.read_text(encoding='utf-8')
          settings = settings.replace(
              'local MAX_SETTINGS_REGISTRATION_RETRIES = 10\n',
              'local MAX_SETTINGS_REGISTRATION_RETRIES = 10\n\n'
              'local VALID_NETWORK_CHANNELS = {\n'
              '    CHANNEL = true,\n'
              '    PARTY = true,\n'
              '    RAID = true,\n'
              '    INSTANCE_CHAT = true,\n'
              '    GUILD = true,\n'
              '}\n',
              1,
          )
          settings = settings.replace(
              'explanation:SetText("A player is considered connected after this client hears AZQUEST traffic from them within the last 90 seconds.")',
              'explanation:SetText("A player is considered connected after this client hears AZQUEST traffic from them within the last 90 seconds through the custom channel or a shared party, raid, instance, or guild transport.")',
              1,
          )
          settings = settings.replace(
              '    if prefix ~= PREFIX or channel ~= "CHANNEL" or not text or not sender then\n        return\n    end',
              '    if prefix ~= PREFIX or not VALID_NETWORK_CHANNELS[channel] or not text or not sender then\n        return\n    end',
              1,
          )
          settings_path.write_text(settings, encoding='utf-8')

          toc_path = Path('AzerothQuesting.toc')
          toc = toc_path.read_text(encoding='utf-8')
          assert '## Version: 0.3.0-beta.8' in toc, 'Expected Beta 8 TOC version'
          toc = toc.replace('## Version: 0.3.0-beta.8', '## Version: 0.3.0-beta.9', 1)
          toc_path.write_text(toc, encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          header = '# Azeroth Questing Changelog\n\n'
          assert changelog.startswith(header), 'Unexpected changelog header'
          entry = '''**VERSION 0.3.0 Beta 9 - September 11, 2026 - Available on GitHub Pre-release**\n\n* **Added** multi-transport Azeroth Questing Network delivery. In addition to the existing `AzerothQuesting` custom channel, the addon now sends the same `AZQUEST` hello and anonymous quest-evidence protocol through the currently applicable **PARTY**, **RAID**, **INSTANCE_CHAT**, and **GUILD** addon-message transports. This allows Alliance and Horde Azeroth Questing clients to exchange research when WoW places them in a supported shared cross-faction group, instance group, raid, or guild.\n\n* **Improved** transport scheduling so group/instance and guild deliveries are queued ahead of the same-faction custom-channel copy and only one addon transmission is attempted per existing send tick. This preserves the existing throttle-aware queue instead of multiplying several sends into one tick.\n\n* **Added** a short session-only inbound deduplication window keyed by sender and protocol message. When overlapping transports deliver the same `AZQUEST` payload to one client, it is processed once so a party/guild/channel fan-out does not create duplicate Companion research observations. The deduplication cache is memory-only and is cleared on `/reload` or logout.\n\n* **Improved** the **Connected Players** Settings page and `/aq peers` diagnostics to recognize peers heard through all supported Azeroth Questing transports rather than only the custom channel. Player names remain session-only and are not added to SavedVariables or uploaded to the Azeroth Questing Server.\n\n* **Kept** the network payload protocol and Companion/server research schema unchanged. No Companion, Website, or Azeroth Questing Server build is required specifically for multi-transport peer delivery; existing anonymous `source = "peer"` observations continue through the same Companion queue.\n\n* **Changed** the addon version from `0.3.0-beta.8` to `0.3.0-beta.9` because Beta 8 had already been published/consumed before cross-faction shared-context transport was approved.\n\n*This v0.3.0 Beta 9 multi-transport behavior has not yet been tested inside World of Warcraft. Test an Alliance and Horde client running Beta 9 in a supported cross-faction party/raid/instance group and, separately if available, a cross-faction guild. Verify `/aq peers` and **Settings > AddOns > Azeroth Questing** can see the opposite-faction peer, a quest-evidence event is accepted once rather than once per overlapping transport, the existing same-faction custom-channel path still works, and leaving the shared WoW context removes that direct cross-faction path. Azeroth Questing still cannot directly discover arbitrary opposite-faction players who share no WoW-supported group/guild context; global aggregation continues through Azeroth Questing Companion and Azeroth Questing Server. No successful Beta 9 in-game or cross-faction test is claimed yet.*\n\n---\n\n'''
          changelog_path.write_text(header + entry + changelog[len(header):], encoding='utf-8')
          PY

      - name: Validate Lua and diff
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          luac -p AzerothNetwork.lua
          luac -p Settings.lua
          git diff --check

      - name: Commit Beta 9 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AzerothNetwork.lua Settings.lua AzerothQuesting.toc CHANGELOG.md
          git commit -m "Prepare addon v0.3.0-beta.9 cross-faction network"
          git push origin HEAD:main
