name: Apply Beta 10 hotfix

on:
  push:
    paths:
      - .github/workflows/apply-beta10-network-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/apply_beta10_patch.py

      - name: Validate patch
        shell: bash
        run: |
          git diff --check
          grep -n '^## Interface:\|^## Version:' AzerothQuesting.toc
          grep -n -m1 '^\*\*VERSION 0.3.0 Beta 10 ' CHANGELOG.md

      - name: Commit and push Beta 10
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Release addon v0.3.0-beta.10 network send fix'
          git push origin HEAD:main
