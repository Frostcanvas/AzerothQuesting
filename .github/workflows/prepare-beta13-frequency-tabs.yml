name: Prepare Beta 13 quest frequency tabs

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/prepare-beta13-frequency-tabs.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply Beta 13 changes
        shell: bash
        run: python3 .github/scripts/prepare_beta13.py

      - name: Validate Beta 13 addon
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          find . -type f -name '*.lua' -not -path './.git/*' -print0 | xargs -0 -n1 luac -p
          git diff --check
          grep -F '## Version: 0.3.0-beta.13' AzerothQuesting.toc
          grep -F 'VERSION 0.3.0 Beta 13' CHANGELOG.md
          grep -F 'zoneTab:SetText("Zone Quests")' DailyQuests.lua
          grep -F 'repeatableTab:SetText("Daily / Weekly")' DailyQuests.lua
          grep -F 'function ZQG.FilterQuestsForDisplay' DailyQuests.lua
          grep -F 'local displayQuests = GetDisplayQuests()' Core.lua

      - name: Commit release and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/prepare-beta13-frequency-tabs.yml
          rm .github/scripts/prepare_beta13.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Core.lua QuestPriority.lua DailyQuests.lua AzerothQuesting.toc CHANGELOG.md .github/workflows/prepare-beta13-frequency-tabs.yml .github/scripts/prepare_beta13.py
          git commit -m 'Release addon v0.3.0-beta.13'
          git push origin HEAD:main
