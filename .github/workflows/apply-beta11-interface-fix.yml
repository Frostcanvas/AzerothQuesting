name: Apply Addon Beta 11 Retail interface fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/aq_fix_beta11.py'
      - '.github/workflows/apply-beta11-interface-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply Beta 11 changes
        run: python3 .github/aq_fix_beta11.py

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^## Interface: 120100$' AzerothQuesting.toc
          grep -q '^## Version: 0.3.0-beta.11$' AzerothQuesting.toc
          grep -q '^\*\*VERSION 0.3.0 Beta 11 - September 11, 2026 - Available on GitHub Pre-release\*\*$' CHANGELOG.md
          git diff --check

      - name: Commit and push Beta 11
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/aq_fix_beta11.py
          rm -f .github/workflows/apply-beta11-interface-fix.yml
          rm -f .github/aq_0231_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release addon v0.3.0-beta.11 live Retail interface fix'
          git push origin HEAD:main
