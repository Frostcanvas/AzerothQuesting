name: Publish addon Beta 16 compact guide controller

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-beta16-compact-guide.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          find . -type f -name '*.lua' -not -path './.git/*' -print0 | xargs -0 -n1 luac -p
          git diff --check
          grep -F '## Version: 0.3.0-beta.16' AzerothQuesting.toc
          grep -F '**VERSION 0.3.0 Beta 16 - September 12, 2026 - Available on GitHub Pre-release**' CHANGELOG.md
          if grep -Fq 'AzerothQuestingGuideModeFrame' GuideMode.lua; then
            echo 'Old boxed Guide Mode frame still exists' >&2
            exit 1
          fi

      - name: Build packages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package AzerothQuesting.zip AzerothQuesting-0.3.0-beta.16.zip
          mkdir -p package/AzerothQuesting
          rsync -a --exclude='.git' --exclude='.github' --exclude='package' ./ package/AzerothQuesting/
          (cd package && zip -qr ../AzerothQuesting.zip AzerothQuesting)
          cp AzerothQuesting.zip AzerothQuesting-0.3.0-beta.16.zip

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          awk '
            BEGIN { found = 0 }
            /^\*\*VERSION / {
              if (found) exit
              if (index($0, "**VERSION 0.3.0 Beta 16 -") == 1) found = 1
            }
            found {
              if ($0 == "---") exit
              print
            }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Publish GitHub Pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='addon-v0.3.0-beta.16'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --target b05b2c446fe85a2dabebd15de857b98940515b1d --title 'Azeroth Questing v0.3.0-beta.16' --notes-file release-notes.md --prerelease
          fi
          gh release upload "$TAG" AzerothQuesting.zip AzerothQuesting-0.3.0-beta.16.zip --clobber

      - name: Remove temporary publisher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/publish-beta16-compact-guide.yml
          git commit -m 'Remove Beta 16 compact guide publisher'
          git push origin HEAD:main
