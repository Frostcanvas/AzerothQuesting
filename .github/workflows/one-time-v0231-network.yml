name: One-time v0.2.31 network integration

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply v0.2.31 patch
        run: python3 .github/aq_0231_patch.py

      - name: Validate addon files
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          for file in *.lua libs/LibStub/*.lua libs/WagoAnalytics/*.lua; do
            luac -p "$file"
          done
          grep -Fq '## Version: 0.2.31' AzerothQuesting.toc
          grep -Fq 'CompanionSync.lua' AzerothQuesting.toc
          grep -Fq 'AzerothNetwork.lua' AzerothQuesting.toc
          grep -Fq 'ZQGMAPQUESTDATA|3' MapQuestLearning.lua
          grep -Fq 'classFile' MapQuestLearning.lua
          grep -Fq 'AzerothQuesting' AzerothNetwork.lua
          grep -Fq 'VERSION 0.2.31 - September 8, 2026 - Available on GitHub' CHANGELOG.md
          git diff --check

      - name: Commit v0.2.31
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No v0.2.31 changes were needed."
            exit 0
          fi
          git config user.name "Frostcanvas"
          git config user.email "131615585+Frostcanvas@users.noreply.github.com"
          git add AzerothQuesting.toc MapQuestLearning.lua CHANGELOG.md
          git commit -m "Release Azeroth Questing v0.2.31 network foundation"
          git push origin HEAD:main
