name: Record Beta 11 guild test

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  record:
    if: startsWith(github.event.head_commit.message, 'Record Beta 11 guild test helper')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Record verified in-game guild test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          old = "*Beta 11 has not yet been tested inside World of Warcraft. After updating, use `/reload` or relog and verify Azeroth Questing appears again in the addon list and under **Settings > AddOns**, reports `0.3.0-beta.11`, and then repeat the same-realm PARTY peer test. No successful Beta 11 in-game test is claimed yet.*"
          new = "* **Verified in World of Warcraft** that Beta 11 loads again on live Retail and that the **GUILD** transport works bidirectionally across both faction and realm boundaries. After both clients were fully logged out and logged back in to clear the session-only peer list, the Alliance client started at **Connected now: 0 players**; when `Moralni-Bonechewer` came online in the same guild while the characters were not grouped, it updated to **1 player** and showed Moralni on `0.3.0-beta.11`. The reverse Horde-side test also started at **0 players** and then updated to **1 player**, showing `Frostlendian-BleedingHollow` after that Alliance character came online. This confirms fresh, bidirectional **cross-faction + cross-realm GUILD peer discovery** rather than a leftover PARTY/session-cache result. Remaining transport validation still includes cross-faction PARTY, RAID, INSTANCE_CHAT, and any final custom-channel/deduplication checks before Stable approval.*"
          if old not in text:
              raise SystemExit('Expected Beta 11 untested note was not found; refusing to rewrite changelog.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Commit test record and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/record-beta11-guild-test.yml
          git add CHANGELOG.md
          git commit -m "Record Beta 11 cross-faction guild test"
          git push

      - name: Synchronize Beta 11 GitHub Pre-release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES_FILE="beta11-release-notes.md"
          awk '
            BEGIN { found = 0 }
            /^\*\*VERSION 0\.3\.0 Beta 11 -/ { found = 1 }
            found {
              if ($0 == "---") exit
              print
            }
          ' CHANGELOG.md > "$NOTES_FILE"
          test -s "$NOTES_FILE"
          gh release edit addon-v0.3.0-beta.11 --notes-file "$NOTES_FILE"
