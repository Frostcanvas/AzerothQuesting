name: Package AzerothQuesting

on:
  push:
    branches:
      - main
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Lua sources
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          find . -type f -name '*.lua' -not -path './.git/*' -print0 | xargs -0 -n1 luac -p
          git diff --check

      - name: Build addon package
        id: package
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(awk '/^## Version:/ { print $3; exit }' AzerothQuesting.toc)"
          if [ -z "$VERSION" ]; then
            echo "Could not read addon version from AzerothQuesting.toc" >&2
            exit 1
          fi

          rm -rf package
          mkdir -p package/AzerothQuesting

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='package' \
            ./ package/AzerothQuesting/

          STABLE_ZIP_NAME="AzerothQuesting.zip"
          VERSIONED_ZIP_NAME="AzerothQuesting-${VERSION}.zip"
          (
            cd package
            zip -qr "../${STABLE_ZIP_NAME}" AzerothQuesting
          )
          cp "${STABLE_ZIP_NAME}" "${VERSIONED_ZIP_NAME}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "stable_zip_name=${STABLE_ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "versioned_zip_name=${VERSIONED_ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Prepare changelog release notes
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.package.outputs.version }}"
          DISPLAY_VERSION="$VERSION"
          if [[ "$VERSION" =~ ^(.+)-beta\.([0-9]+)$ ]]; then
            DISPLAY_VERSION="${BASH_REMATCH[1]} Beta ${BASH_REMATCH[2]}"
          elif [[ "$VERSION" =~ ^(.+)-rc\.([0-9]+)$ ]]; then
            DISPLAY_VERSION="${BASH_REMATCH[1]} RC ${BASH_REMATCH[2]}"
          fi

          NOTES_FILE="release-notes-${VERSION}.md"
          awk -v version="$DISPLAY_VERSION" '
            BEGIN { found = 0 }
            /^\*\*VERSION / {
              if (found) exit
              prefix = "**VERSION " version " -"
              if (index($0, prefix) == 1) found = 1
            }
            found {
              if ($0 == "---") exit
              print
            }
          ' CHANGELOG.md > "$NOTES_FILE"

          if [ ! -s "$NOTES_FILE" ]; then
            echo "Could not find CHANGELOG.md entry for ${DISPLAY_VERSION}." >&2
            exit 1
          fi

          echo "notes_file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: Upload development package
        uses: actions/upload-artifact@v4
        with:
          name: AzerothQuesting
          path: package
          if-no-files-found: error

      - name: Publish updater-visible Beta Pre-release
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release addon v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.package.outputs.version }}"
          TAG="addon-v${VERSION}"
          NOTES_FILE="${{ steps.release_notes.outputs.notes_file }}"
          IS_PRERELEASE=false
          if [[ "$VERSION" == *-* ]]; then
            IS_PRERELEASE=true
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$IS_PRERELEASE" = true ]; then
              gh release create "$TAG" --target "$GITHUB_SHA" --title "Azeroth Questing v${VERSION}" --notes-file "$NOTES_FILE" --prerelease
            else
              echo "Stable publication requires explicit approval; refusing automatic Stable release." >&2
              exit 1
            fi
          else
            gh release edit "$TAG" --notes-file "$NOTES_FILE"
          fi

          gh release upload "$TAG" \
            "${{ steps.package.outputs.stable_zip_name }}" \
            "${{ steps.package.outputs.versioned_zip_name }}" \
            --clobber

      - name: Attach packages and changelog to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          NOTES_FILE="${{ steps.release_notes.outputs.notes_file }}"
          gh release edit "$TAG" --notes-file "$NOTES_FILE"
          gh release upload "$TAG" "${{ steps.package.outputs.stable_zip_name }}" "${{ steps.package.outputs.versioned_zip_name }}" --clobber
