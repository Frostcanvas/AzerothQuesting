name: Package AzerothQuesting

on:
  push:
    branches:
      - main
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build addon package
        id: package
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(awk '/^## Version:/ { print $3; exit }' AzerothQuesting.toc)"
          if [ -z "$VERSION" ]; then
            echo "Could not read addon version from AzerothQuesting.toc" >&2
            exit 1
          fi

          rm -rf package
          mkdir -p package/AzerothQuesting

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='package' \
            ./ package/AzerothQuesting/

          ZIP_NAME="AzerothQuesting-${VERSION}.zip"
          (
            cd package
            zip -qr "../${ZIP_NAME}" AzerothQuesting
          )

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload development package
        uses: actions/upload-artifact@v4
        with:
          name: AzerothQuesting
          path: package
          if-no-files-found: error

      - name: Attach package to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.package.outputs.zip_name }}" --clobber
