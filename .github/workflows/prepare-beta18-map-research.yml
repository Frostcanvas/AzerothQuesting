name: Prepare addon Beta 18 map research

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/prepare-beta18-map-research.yml
      - .github/scripts/prepare_beta18_changelog.py

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Add changelog
        run: python3 .github/scripts/prepare_beta18_changelog.py

      - name: Validate addon source
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          find . -type f -name '*.lua' -not -path './.git/*' -print0 | xargs -0 -n1 luac -p
          grep -q '^## Version: 0.3.0-beta.18$' AzerothQuesting.toc
          grep -q '^MapResearch.lua$' AzerothQuesting.toc
          git diff --check

      - name: Commit addon Beta 18
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/prepare-beta18-map-research.yml .github/scripts/prepare_beta18_changelog.py
          git add CHANGELOG.md
          git commit -m "Release addon v0.3.0-beta.18"
          git push origin HEAD:main
