name: Release addon Beta 17 pickup batches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-beta17-pickup-batches.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply Beta 17 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/release_beta17.py

      - name: Validate addon source
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          find . -type f -name '*.lua' -not -path './.git/*' -print0 | xargs -0 -n1 luac -p
          git diff --check
          grep -F '## Version: 0.3.0-beta.17' AzerothQuesting.toc
          grep -F '**VERSION 0.3.0 Beta 17 - September 12, 2026 - Available on GitHub Pre-release**' CHANGELOG.md

      - name: Commit Beta 17
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/release-beta17-pickup-batches.yml .github/scripts/release_beta17.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Frostcanvas@users.noreply.github.com'
          git add GuideMode.lua NavigationHUD.lua AzerothQuesting.toc CHANGELOG.md
          git commit -m 'Release addon v0.3.0-beta.17'
          git push origin HEAD:main
