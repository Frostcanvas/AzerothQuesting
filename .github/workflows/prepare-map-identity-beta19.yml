name: Prepare map identity research Beta 19

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Apply Beta 19 map identity research
        shell: bash
        run: |
          set -euo pipefail
          cat > MapResearch.lua <<'LUA'
          local ADDON_NAME, ZQG = ...

          local MAX_QUEUE = 5000
          local sessionContexts = {}
          local pendingRecord = false
          local lastMapID = 0
          local lastTransitionFromMapID = 0
          local lastTransitionToMapID = 0

          local function Print(msg)
              DEFAULT_CHAT_FRAME:AddMessage("|cff66ccffAzeroth Questing:|r " .. tostring(msg))
          end

          local function Accessible(value)
              if value == nil then
                  return false
              end
              if canaccessvalue then
                  local ok, allowed = pcall(canaccessvalue, value)
                  if ok then
                      return allowed and true or false
                  end
              end
              return true
          end

          local function SafeString(value)
              if not Accessible(value) or type(value) ~= "string" or value == "" then
                  return nil
              end
              return value
          end

          local function SafeNumber(value)
              if not Accessible(value) or type(value) ~= "number" then
                  return nil
              end
              return value
          end

          local function SafeTable(value)
              if type(value) ~= "table" then
                  return nil
              end
              if canaccesstable then
                  local ok, allowed = pcall(canaccesstable, value)
                  if ok and not allowed then
                      return nil
                  end
              end
              return value
          end

          local function AddonVersion()
              if C_AddOns and C_AddOns.GetAddOnMetadata then
                  local ok, version = pcall(C_AddOns.GetAddOnMetadata, ADDON_NAME, "Version")
                  if ok then
                      version = SafeString(version)
                      if version then
                          return version
                      end
                  end
              elseif GetAddOnMetadata then
                  local ok, version = pcall(GetAddOnMetadata, ADDON_NAME, "Version")
                  if ok then
                      version = SafeString(version)
                      if version then
                          return version
                      end
                  end
              end
              return "unknown"
          end

          local function CurrentTime()
              if GetServerTime then
                  local ok, value = pcall(GetServerTime)
                  if ok then
                      value = SafeNumber(value)
                      if value and value > 0 then
                          return value
                      end
                  end
              end
              return time and time() or 0
          end

          local function HexEncode(value)
              value = SafeString(value)
              if not value then
                  return ""
              end

              local encoded = {}
              for index = 1, #value do
                  encoded[index] = string.format("%02X", string.byte(value, index))
              end
              return table.concat(encoded)
          end

          local function WireToken(value)
              value = tostring(value or "")
              value = value:gsub("[|\r\n]", "_")
              return value
          end

          local function PlayerClass()
              if ZQG.GetPlayerClassContext then
                  local classID, classFile = ZQG.GetPlayerClassContext()
                  return tonumber(classID) or 0, SafeString(classFile) or "UNKNOWN"
              end

              if UnitClass then
                  local ok, _, classFile, classID = pcall(UnitClass, "player")
                  if ok then
                      return tonumber(classID) or 0, SafeString(classFile) or "UNKNOWN"
                  end
              end
              return 0, "UNKNOWN"
          end

          local function PlayerFaction()
              if UnitFactionGroup then
                  local ok, faction = pcall(UnitFactionGroup, "player")
                  if ok and Accessible(faction)
                      and (faction == "Alliance" or faction == "Horde" or faction == "Neutral") then
                      return faction
                  end
              end
              return "Neutral"
          end

          local function PlayerLevel()
              if UnitLevel then
                  local ok, level = pcall(UnitLevel, "player")
                  if ok then
                      level = SafeNumber(level)
                      if level then
                          return level
                      end
                  end
              end
              return 0
          end

          local function GetStore()
              ZoneQuestGuideDB = ZoneQuestGuideDB or {}
              ZoneQuestGuideDB.companionSync = ZoneQuestGuideDB.companionSync or {
                  version = 3,
                  nextSequence = 1,
                  observations = {},
              }

              local store = ZoneQuestGuideDB.companionSync
              store.nextSequence = tonumber(store.nextSequence) or 1
              store.observations = store.observations or {}
              return store
          end

          local function PruneQueue(store)
              local count = #store.observations
              if count <= MAX_QUEUE then
                  return
              end

              local keepFrom = count - MAX_QUEUE + 1
              local compact = {}
              for index = keepFrom, count do
                  compact[#compact + 1] = store.observations[index]
              end
              store.observations = compact
          end

          local function MapInfo(mapID)
              if not C_Map or not C_Map.GetMapInfo or not mapID or mapID <= 0 then
                  return nil
              end
              local ok, info = pcall(C_Map.GetMapInfo, mapID)
              info = ok and SafeTable(info) or nil
              return info
          end

          local function MapArtID(mapID)
              if not C_Map or not C_Map.GetMapArtID then
                  return 0
              end
              local ok, value = pcall(C_Map.GetMapArtID, mapID)
              value = ok and SafeNumber(value) or nil
              return value and math.floor(value) or 0
          end

          local function ScenarioContext()
              local scenarioName
              local scenarioStep

              if C_Scenario and C_Scenario.GetInfo then
                  local ok, first = pcall(C_Scenario.GetInfo)
                  if ok then
                      local info = SafeTable(first)
                      if info then
                          scenarioName = SafeString(info.name) or SafeString(info.title)
                      else
                          scenarioName = SafeString(first)
                      end
                  end
              end

              if C_Scenario and C_Scenario.GetStepInfo then
                  local ok, first = pcall(C_Scenario.GetStepInfo)
                  if ok then
                      local info = SafeTable(first)
                      if info then
                          scenarioStep = SafeString(info.title) or SafeString(info.name) or SafeString(info.description)
                      else
                          scenarioStep = SafeString(first)
                      end
                  end
              end

              return scenarioName, scenarioStep
          end

          local function DifficultyName(difficultyID)
              if not difficultyID or difficultyID <= 0 or not GetDifficultyInfo then
                  return nil
              end
              local ok, name = pcall(GetDifficultyInfo, difficultyID)
              if ok then
                  return SafeString(name)
              end
              return nil
          end

          local function PlayerPosition(mapID)
              if not C_Map or not C_Map.GetPlayerMapPosition then
                  return nil, nil
              end

              local ok, position = pcall(C_Map.GetPlayerMapPosition, mapID, "player")
              if not ok or not position or not Accessible(position) then
                  return nil, nil
              end

              local x, y
              if position.GetXY then
                  local xyOK, px, py = pcall(position.GetXY, position)
                  if xyOK then
                      x = SafeNumber(px)
                      y = SafeNumber(py)
                  end
              end

              if not x or not y or x < 0 or x > 1 or y < 0 or y > 1 then
                  return nil, nil
              end
              return x, y
          end

          local function PreviousMapIDFor(mapID)
              if lastMapID > 0 and lastMapID ~= mapID then
                  return lastMapID
              end
              if lastTransitionToMapID == mapID and lastTransitionFromMapID > 0 then
                  return lastTransitionFromMapID
              end
              return 0
          end

          local function NoteMapTransition(mapID)
              if lastMapID > 0 and lastMapID ~= mapID then
                  lastTransitionFromMapID = lastMapID
                  lastTransitionToMapID = mapID
              end
              lastMapID = mapID
          end

          local function CurrentMapContext()
              if not C_Map or not C_Map.GetBestMapForUnit then
                  return nil
              end

              local ok, mapID = pcall(C_Map.GetBestMapForUnit, "player")
              mapID = ok and SafeNumber(mapID) or nil
              if not mapID or mapID <= 0 then
                  return nil
              end
              mapID = math.floor(mapID)

              local info = MapInfo(mapID)
              local mapName = info and SafeString(info.name) or nil
              local parentMapID = info and tonumber(info.parentMapID) or 0
              local mapType = info and tonumber(info.mapType) or 0
              parentMapID = parentMapID or 0
              mapType = mapType or 0

              local parentMapName
              local parentInfo = MapInfo(parentMapID)
              if parentInfo then
                  parentMapName = SafeString(parentInfo.name)
              end

              local instanceName
              local instanceType = "none"
              local difficultyID = 0
              local instanceID = 0
              if GetInstanceInfo then
                  local infoOK, name, kind, difficulty, _, _, _, instance = pcall(GetInstanceInfo)
                  if infoOK then
                      instanceName = SafeString(name)
                      instanceType = SafeString(kind) or "none"
                      difficultyID = tonumber(difficulty) or 0
                      instanceID = tonumber(instance) or 0
                  end
              end

              local phase
              if ZQG.GetTimePhaseKey then
                  local phaseOK, value = pcall(ZQG.GetTimePhaseKey, mapID)
                  if phaseOK then
                      phase = SafeString(value)
                  end
              end

              local scenarioName, scenarioStep = ScenarioContext()
              local positionX, positionY = PlayerPosition(mapID)

              return {
                  mapID = mapID,
                  mapName = mapName,
                  parentMapID = parentMapID,
                  parentMapName = parentMapName,
                  mapType = mapType,
                  mapArtID = MapArtID(mapID),
                  instanceName = instanceName,
                  instanceType = instanceType,
                  difficultyID = difficultyID,
                  difficultyName = DifficultyName(difficultyID),
                  instanceID = instanceID,
                  scenarioName = scenarioName,
                  scenarioStep = scenarioStep,
                  positionX = positionX,
                  positionY = positionY,
                  previousMapID = PreviousMapIDFor(mapID),
                  phase = phase,
              }
          end

          local function ResearchIdentity(context)
              if context.scenarioName then
                  return "CONFIRMED", context.scenarioName
              end

              if context.instanceType == "scenario" and context.instanceName then
                  return "CONFIRMED", context.instanceName
              end

              if context.phase then
                  local label = context.mapName or ("UiMapID " .. tostring(context.mapID))
                  return "LIKELY", label .. " - " .. context.phase
              end

              if context.instanceName and context.instanceType and context.instanceType ~= "none"
                  and context.instanceType ~= "none" then
                  return "LIKELY", context.instanceName
              end

              return "UNKNOWN", context.mapName or ("UiMapID " .. tostring(context.mapID))
          end

          local function ContextKey(context)
              return table.concat({
                  tostring(context.mapID or 0),
                  tostring(context.parentMapID or 0),
                  tostring(context.mapType or 0),
                  tostring(context.mapArtID or 0),
                  tostring(context.instanceID or 0),
                  tostring(context.difficultyID or 0),
                  tostring(context.instanceType or "none"),
                  tostring(context.scenarioName or ""),
                  tostring(context.scenarioStep or ""),
                  tostring(context.phase or ""),
                  tostring(context.previousMapID or 0),
              }, ":")
          end

          local function QueueMapObservation(context, force)
              context = context or CurrentMapContext()
              if not context or not context.mapID then
                  return false
              end

              local signature = ContextKey(context)
              if not force and sessionContexts[signature] then
                  NoteMapTransition(context.mapID)
                  return false
              end
              sessionContexts[signature] = true

              local classID, classFile = PlayerClass()
              local faction = PlayerFaction()
              local level = PlayerLevel()
              local observedAt = CurrentTime()
              local addonVersion = AddonVersion()

              local store = GetStore()
              local sequence = store.nextSequence
              store.nextSequence = sequence + 1
              local key = string.format("m%d-%d", observedAt, sequence)

              local observation = {
                  key = key,
                  sequence = sequence,
                  type = "map",
                  source = "local",
                  mapID = context.mapID,
                  mapName = context.mapName,
                  parentMapID = context.parentMapID,
                  parentMapName = context.parentMapName,
                  mapType = context.mapType,
                  mapArtID = context.mapArtID,
                  instanceName = context.instanceName,
                  instanceType = context.instanceType,
                  difficultyID = context.difficultyID,
                  difficultyName = context.difficultyName,
                  instanceID = context.instanceID,
                  scenarioName = context.scenarioName,
                  scenarioStep = context.scenarioStep,
                  positionX = context.positionX,
                  positionY = context.positionY,
                  previousMapID = context.previousMapID,
                  faction = faction,
                  classID = classID,
                  classFile = classFile,
                  level = level,
                  phase = context.phase,
                  observedAt = observedAt,
                  addonVersion = addonVersion,
              }

              -- Keep AQM1 intact for older Companions. AQM2 reuses the same key and
              -- appends richer Blizzard map/scenario evidence; newer Companions
              -- prefer AQM2 when both records are present.
              observation.wire = table.concat({
                  "AQM1",
                  WireToken(key),
                  tostring(context.mapID),
                  HexEncode(context.mapName),
                  tostring(context.parentMapID or 0),
                  tostring(context.mapType or 0),
                  HexEncode(context.instanceName),
                  WireToken(context.instanceType or "none"),
                  tostring(context.difficultyID or 0),
                  tostring(context.instanceID or 0),
                  WireToken(faction),
                  tostring(classID),
                  WireToken(classFile),
                  tostring(level),
                  HexEncode(context.phase),
                  tostring(observedAt),
                  WireToken(addonVersion),
              }, "|")

              observation.wire2 = table.concat({
                  "AQM2",
                  WireToken(key),
                  tostring(context.mapID),
                  HexEncode(context.mapName),
                  tostring(context.parentMapID or 0),
                  tostring(context.mapType or 0),
                  HexEncode(context.instanceName),
                  WireToken(context.instanceType or "none"),
                  tostring(context.difficultyID or 0),
                  tostring(context.instanceID or 0),
                  WireToken(faction),
                  tostring(classID),
                  WireToken(classFile),
                  tostring(level),
                  HexEncode(context.phase),
                  tostring(observedAt),
                  WireToken(addonVersion),
                  HexEncode(context.parentMapName),
                  tostring(context.mapArtID or 0),
                  HexEncode(context.scenarioName),
                  HexEncode(context.scenarioStep),
                  HexEncode(context.difficultyName),
                  context.positionX and string.format("%.6f", context.positionX) or "",
                  context.positionY and string.format("%.6f", context.positionY) or "",
                  tostring(context.previousMapID or 0),
              }, "|")

              store.observations[#store.observations + 1] = observation
              PruneQueue(store)
              NoteMapTransition(context.mapID)
              return true
          end

          local function PrintCurrentMap(forceRecord)
              local context = CurrentMapContext()
              if not context then
                  Print("Current UiMapID is unavailable.")
                  return
              end

              if forceRecord then
                  QueueMapObservation(context, true)
              end

              Print(string.format("UiMapID %d - %s", context.mapID, context.mapName or "Unknown map"))

              if context.parentMapID and context.parentMapID > 0 then
                  if context.parentMapName then
                      Print(string.format("Parent: %s (%d)", context.parentMapName, context.parentMapID))
                  else
                      Print("Parent UiMapID: " .. tostring(context.parentMapID))
                  end
              end

              if context.mapArtID and context.mapArtID > 0 then
                  Print("Map art ID: " .. tostring(context.mapArtID))
              end

              if context.scenarioName then
                  Print("Scenario: " .. context.scenarioName)
              end
              if context.scenarioStep then
                  Print("Scenario step: " .. context.scenarioStep)
              end

              if context.instanceName and context.instanceType ~= "none" then
                  Print(string.format("Instance: %s (%s, ID %d)", context.instanceName, context.instanceType, context.instanceID or 0))
              elseif context.instanceID and context.instanceID > 0 then
                  Print("Instance ID: " .. tostring(context.instanceID))
              end

              if context.difficultyID and context.difficultyID > 0 then
                  if context.difficultyName then
                      Print(string.format("Difficulty: %s (%d)", context.difficultyName, context.difficultyID))
                  else
                      Print("Difficulty ID: " .. tostring(context.difficultyID))
                  end
              end

              if context.positionX and context.positionY then
                  Print(string.format("Position: %.1f, %.1f", context.positionX * 100, context.positionY * 100))
              end
              if context.previousMapID and context.previousMapID > 0 then
                  Print("Previous UiMapID: " .. tostring(context.previousMapID))
              end
              if context.phase then
                  Print("AQ phase evidence: " .. context.phase)
              end

              local status, identity = ResearchIdentity(context)
              Print(string.format("Research status: %s - %s%s", status, identity, forceRecord and " | recorded" or ""))
          end

          local function ScheduleRecord(delay)
              if pendingRecord or not C_Timer or not C_Timer.After then
                  return
              end
              pendingRecord = true
              C_Timer.After(delay or 0.25, function()
                  pendingRecord = false
                  QueueMapObservation(CurrentMapContext(), false)
              end)
          end

          local events = CreateFrame("Frame")
          events:RegisterEvent("PLAYER_ENTERING_WORLD")
          events:RegisterEvent("ZONE_CHANGED_NEW_AREA")
          events:RegisterEvent("ZONE_CHANGED")
          events:RegisterEvent("ZONE_CHANGED_INDOORS")
          pcall(events.RegisterEvent, events, "UNIT_PHASE")
          pcall(events.RegisterEvent, events, "SCENARIO_UPDATE")
          pcall(events.RegisterEvent, events, "SCENARIO_CRITERIA_UPDATE")
          pcall(events.RegisterEvent, events, "SCENARIO_COMPLETED")
          pcall(events.RegisterEvent, events, "PLAYER_DIFFICULTY_CHANGED")
          events:SetScript("OnEvent", function(_, event, unit)
              if event == "UNIT_PHASE" and unit and unit ~= "player" then
                  return
              end
              ScheduleRecord(event == "PLAYER_ENTERING_WORLD" and 1.0 or 0.25)
          end)

          local previousSlashHandler = SlashCmdList.ZONEQUESTGUIDE
          SlashCmdList.ZONEQUESTGUIDE = function(msg)
              local command = (msg or ""):lower():match("^%s*(.-)%s*$")
              if command == "map" or command == "map id" or command == "mapid" then
                  PrintCurrentMap(false)
                  return
              elseif command == "map record" then
                  PrintCurrentMap(true)
                  return
              end

              if previousSlashHandler then
                  previousSlashHandler(msg)
              end
          end

          ZQG.QueueMapObservation = QueueMapObservation
          ZQG.GetCurrentMapResearchContext = CurrentMapContext
          ZQG.GetCurrentMapResearchIdentity = ResearchIdentity
          LUA

          python3 <<'PY'
          from pathlib import Path

          toc = Path("AzerothQuesting.toc")
          text = toc.read_text(encoding="utf-8")
          old = "## Version: 0.3.0-beta.18"
          assert old in text, "expected Beta 18 TOC version"
          toc.write_text(text.replace(old, "## Version: 0.3.0-beta.19", 1), encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          marker = "# Azeroth Questing Changelog\n\n"
          assert text.startswith(marker), "unexpected changelog header"
          entry = """**VERSION 0.3.0 Beta 19 - September 12, 2026 - Available on GitHub Pre-release**

* **Added** richer Blizzard-backed map identity evidence for phased and scenario content. Map research can now capture parent-map name, map-art ID, scenario name and current scenario step, difficulty name, player map position, and the previous UiMapID seen during the current play session in addition to the existing UiMapID/instance/phase context.

* **Added** the backward-compatible `AQM2` research record. Beta 19 still writes the original `AQM1` record for older Companions, while `AQM2` appends the richer map-identity fields under the same observation key so updated Companions can prefer the more complete copy without creating duplicate observations.

* **Improved** `/aq map` and `/aq map record` to show the evidence a tester can use to identify a map copy: Blizzard map and parent names/IDs, map-art ID, scenario and step, instance and difficulty context, coordinates, previous UiMapID, and any known Azeroth Questing phase evidence.

* **Added** local map-identity confidence output to `/aq map`: **CONFIRMED** when Blizzard directly exposes a scenario name (or a named scenario instance), **LIKELY** when phase/instance context strongly distinguishes the copy, and **UNKNOWN** when the addon has only generic map metadata. The addon does not hard-code guesses for Battle for Darkshore, Battle for Stromgarde, or other phased zones.

* **Improved** automatic collection by recording again when scenario state or player difficulty changes, while keeping session deduplication so movement coordinates alone do not create a stream of duplicate observations.

* **Compatibility:** the original `AQM1` handoff remains available. Uploading the new `AQM2` evidence requires **Azeroth Questing Companion 0.1.9-beta.12 or newer** and **Azeroth Questing Server 0.2.12 / schema 5 or newer**. No Website build is required; the LAN Research Map IDs tab is provided by the Azeroth Questing Server.

*Beta 19 still requires in-game validation. Verify `/aq map` does not cause Lua/taint errors, scenario/map-art/parent/coordinate fields appear only when WoW safely exposes them, previous-UiMapID transitions are sensible, and Battle for Darkshore / Battle for Stromgarde observations gain enough evidence to move from UNKNOWN to LIKELY or CONFIRMED without hard-coded assumptions. End-to-end AQM2 synchronization also remains to be verified with Companion Beta 12 and Server 0.2.12. No successful Beta 19 in-game test is claimed yet.*

---

"""
          changelog.write_text(marker + entry + text[len(marker):], encoding="utf-8")
          PY

          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          find . -type f -name '*.lua' -not -path './.git/*' -print0 | xargs -0 -n1 luac -p
          git diff --check

      - name: Commit prepared Beta 19
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/prepare-map-identity-beta19.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare addon v0.3.0-beta.19 map identity research"
          git push
