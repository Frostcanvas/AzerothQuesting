name: Publish addon Beta 12

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-beta12.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate Beta 12 source
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(awk '/^## Version:/ { print $3; exit }' AzerothQuesting.toc)"
          test "$VERSION" = "0.3.0-beta.12"
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          find . -type f -name '*.lua' -not -path './.git/*' -print0 | xargs -0 -n1 luac -p
          git diff --check
          grep -F 'VERSION 0.3.0 Beta 12' CHANGELOG.md
          grep -F 'local INBOUND_DEDUP_WINDOW = 20' AzerothNetwork.lua
          grep -F 'local function SenderIdentityKey(sender)' AzerothNetwork.lua

      - name: Build addon packages
        shell: bash
        run: |
          set -euo pipefail
          VERSION="0.3.0-beta.12"
          rm -rf package AzerothQuesting.zip "AzerothQuesting-${VERSION}.zip"
          mkdir -p package/AzerothQuesting
          rsync -a --exclude='.git' --exclude='.github' --exclude='package' ./ package/AzerothQuesting/
          (cd package && zip -qr ../AzerothQuesting.zip AzerothQuesting)
          cp AzerothQuesting.zip "AzerothQuesting-${VERSION}.zip"

      - name: Prepare Beta 12 release notes
        shell: bash
        run: |
          set -euo pipefail
          awk '
            BEGIN { found = 0 }
            /^\*\*VERSION 0\.3\.0 Beta 12 -/ { found = 1 }
            found {
              if ($0 == "---") exit
              print
            }
          ' CHANGELOG.md > release-notes-0.3.0-beta.12.md
          test -s release-notes-0.3.0-beta.12.md

      - name: Publish GitHub Pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='addon-v0.3.0-beta.12'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes-0.3.0-beta.12.md --prerelease
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title 'Azeroth Questing v0.3.0-beta.12' --notes-file release-notes-0.3.0-beta.12.md --prerelease
          fi
          gh release upload "$TAG" AzerothQuesting.zip AzerothQuesting-0.3.0-beta.12.zip --clobber
          gh release view "$TAG" --json isPrerelease,assets

      - name: Remove temporary publisher
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/publish-beta12.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Remove Beta 12 publish helper'
            git push origin HEAD:main
          fi
