name: Prepare addon Beta 15 navigation HUD redesign

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/prepare-beta15-navigation-style.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4

      - name: Redesign navigation HUD and bump Beta 15
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('NavigationHUD.lua')
          text = path.read_text()

          start = text.index('local hud = CreateFrame("Frame", "ZoneQuestGuideNavigationHUD", UIParent)')
          end = text.index('local function GetStatusText(quest)')
          new_ui = r'''local hud = CreateFrame("Frame", "ZoneQuestGuideNavigationHUD", UIParent)
          hud:SetSize(360, 140)
          hud:SetPoint("TOP", UIParent, "TOP", 0, -92)
          hud:SetFrameStrata("HIGH")
          hud:SetClampedToScreen(true)
          hud:EnableMouse(true)
          hud:SetMovable(true)
          hud:RegisterForDrag("LeftButton")
          hud:Hide()

          -- Keep the HUD visually light like a guide arrow instead of a large panel.
          -- A faint backing remains so white objective text stays readable over bright zones.
          local background = hud:CreateTexture(nil, "BACKGROUND")
          background:SetAllPoints()
          background:SetTexture("Interface\\Buttons\\WHITE8X8")
          background:SetVertexColor(0, 0, 0, 0.10)

          local statusText = hud:CreateFontString(nil, "OVERLAY", "GameFontNormalSmall")
          statusText:SetPoint("TOP", hud, "TOP", 0, -2)
          statusText:SetWidth(340)
          statusText:SetJustifyH("CENTER")
          statusText:SetShadowColor(0, 0, 0, 1)
          statusText:SetShadowOffset(1, -1)

          -- Use Blizzard's minimap arrow texture as a filled, high-contrast navigation
          -- arrow. This is much closer to the compact guide-arrow presentation players
          -- expect than the previous large boxed tracker.
          local arrowShadow = hud:CreateTexture(nil, "ARTWORK")
          arrowShadow:SetSize(76, 76)
          arrowShadow:SetPoint("CENTER", hud, "CENTER", 0, 15)
          arrowShadow:SetTexture("Interface\\Minimap\\MinimapArrow")
          arrowShadow:SetVertexColor(0, 0, 0, 0.90)

          local arrowTexture = hud:CreateTexture(nil, "OVERLAY")
          arrowTexture:SetSize(66, 66)
          arrowTexture:SetPoint("CENTER", hud, "CENTER", 0, 15)
          arrowTexture:SetTexture("Interface\\Minimap\\MinimapArrow")
          arrowTexture:SetVertexColor(0.35, 1.00, 0.08, 1)

          local targetText = hud:CreateFontString(nil, "OVERLAY", "GameFontNormalLarge")
          targetText:SetPoint("TOP", hud, "CENTER", 0, -22)
          targetText:SetWidth(350)
          targetText:SetJustifyH("CENTER")
          targetText:SetWordWrap(false)
          targetText:SetShadowColor(0, 0, 0, 1)
          targetText:SetShadowOffset(1, -1)

          local detailText = hud:CreateFontString(nil, "OVERLAY", "GameFontHighlightSmall")
          detailText:SetPoint("TOP", targetText, "BOTTOM", 0, -3)
          detailText:SetWidth(350)
          detailText:SetJustifyH("CENTER")
          detailText:SetShadowColor(0, 0, 0, 1)
          detailText:SetShadowOffset(1, -1)

          local function SetArrowVisible(visible)
              if visible then
                  arrowShadow:Show()
                  arrowTexture:Show()
              else
                  arrowShadow:Hide()
                  arrowTexture:Hide()
              end
          end

          local function DrawArrow(angle)
              if type(angle) ~= "number" then
                  SetArrowVisible(false)
                  return
              end

              -- Positive relative angles mean the target is to the player's right.
              -- Texture rotation uses the opposite sign for the expected on-screen turn.
              arrowShadow:SetRotation(-angle)
              arrowTexture:SetRotation(-angle)
              SetArrowVisible(true)
          end

          '''
          text = text[:start] + new_ui + text[end:]

          target_pattern = re.compile(r'''local function GetTargetLabel\(quest\).*?\nend\n\nlocal function GetRelativeAngle''', re.S)
          target_replacement = r'''local function AccessibleString(value)
              if value == nil then
                  return nil
              end
              if canaccessvalue and not canaccessvalue(value) then
                  return nil
              end
              if type(value) ~= "string" then
                  return nil
              end
              return value
          end

          local function FirstObjectiveText(questID)
              if not questID or not C_QuestLog or not C_QuestLog.GetQuestObjectives then
                  return nil
              end

              local ok, objectives = pcall(C_QuestLog.GetQuestObjectives, questID)
              if not ok or type(objectives) ~= "table" then
                  return nil
              end

              local first
              for _, objective in ipairs(objectives) do
                  local text = AccessibleString(objective and objective.text)
                  if text and text ~= "" then
                      first = first or text
                      if not objective.finished then
                          return text
                      end
                  end
              end
              return first
          end

          local function GetTargetLabel(quest)
              if not quest then
                  return ""
              end

              local questName = quest.name or ("Quest " .. tostring(quest.id or ""))
              local status = ZQG.GetQuestStatusKey and ZQG.GetQuestStatusKey(quest)
                  or (quest.accepted and "progress" or "available")

              if status == "available" then
                  return "Pick up " .. questName
              elseif status == "turnin" then
                  return "Turn in " .. questName
              end

              local objective = FirstObjectiveText(quest.id)
              if objective then
                  return objective
              end

              local hint = quest.id and ZQG.LocationHints and ZQG.LocationHints[quest.id] or nil
              if hint and hint.short then
                  return questName .. "  |cffffcc00[" .. hint.short .. "]|r"
              end
              return questName
          end

          local function GetRelativeAngle'''
          text, count = target_pattern.subn(target_replacement, text, count=1)
          if count != 1:
              raise SystemExit('Could not replace GetTargetLabel block')

          detail_pattern = re.compile(r'''local function UpdateDetailText\(\).*?\nend\n\nlocal function ApplyHUDVisibility''', re.S)
          detail_replacement = r'''local function UpdateDetailText()
              if not selectedQuest then
                  detailText:SetText("")
                  return
              end

              if IsOnTaxi() and selectedMapID and CurrentMapID() ~= selectedMapID then
                  detailText:SetText("|cffffcc00Flight path - holding quest target|r")
                  return
              end

              -- Do not derive an ETA from GetUnitSpeed(). Retail can expose movement
              -- speed as a secret value, so the HUD intentionally shows safe map-based
              -- distance only rather than risking taint for a timer.
              local distance = GetDistanceYards(selectedQuest, selectedMapID)
              local distanceText = FormatDistance(distance)
              local questName = selectedQuest.name or ("Quest " .. tostring(selectedQuest.id or ""))

              if distanceText then
                  detailText:SetText(distanceText .. "  |cffb8b8b8• " .. questName .. "|r")
              elseif selectedQuest.accepted then
                  detailText:SetText("|cffb8b8b8" .. questName .. " • Tracked by WoW|r")
              else
                  detailText:SetText("|cffb8b8b8" .. questName .. "|r")
              end
          end

          local function ApplyHUDVisibility'''
          text, count = detail_pattern.subn(detail_replacement, text, count=1)
          if count != 1:
              raise SystemExit('Could not replace UpdateDetailText block')

          # If a direction becomes temporarily unavailable, hide the arrow rather than
          # leaving a stale heading on screen. The text/distance tracker remains useful.
          text = text.replace(
              '''    local targetAngle = GetRelativeAngle(selectedQuest, selectedMapID)\n    if targetAngle == nil then\n        return\n    end''',
              '''    local targetAngle = GetRelativeAngle(selectedQuest, selectedMapID)\n    if targetAngle == nil then\n        lastAngleValid = false\n        DrawArrow(nil)\n        return\n    end'''
          )

          path.write_text(text)

          toc = Path('AzerothQuesting.toc')
          toc_text = toc.read_text()
          if '## Version: 0.3.0-beta.14' not in toc_text:
              raise SystemExit('Unexpected TOC version before Beta 15 bump')
          toc.write_text(toc_text.replace('## Version: 0.3.0-beta.14', '## Version: 0.3.0-beta.15', 1))

          changelog = Path('CHANGELOG.md')
          old = changelog.read_text()
          heading = '# Azeroth Questing Changelog\n\n'
          if not old.startswith(heading):
              raise SystemExit('Unexpected changelog heading')
          entry = '''**VERSION 0.3.0 Beta 15 - September 11, 2026 - Available on GitHub Pre-release**\n\n* **Redesigned** the floating navigation HUD to be much closer to the compact guide-arrow presentation shown in the in-game comparison: a large filled bright-green directional arrow, minimal translucent backing, centered objective text, and distance immediately underneath instead of a large boxed tracker dominating the screen.\n\n* **Improved** the navigation label so accepted quests prefer the first unfinished WoW objective (for example, a collect/kill instruction) while available quests say **Pick up <quest>** and completed accepted quests say **Turn in <quest>**. The quest name remains visible beside the distance for context.\n\n* **Improved** arrow readability with a dark shadow/outline and text shadows so the HUD stays readable against bright outdoor zones without restoring the heavy panel appearance.\n\n* **Changed** direction rendering to use Blizzard's built-in minimap arrow texture and rotate it toward the existing Azeroth Questing target. If a safe direction cannot be calculated, the arrow hides rather than showing a stale or misleading heading.\n\n* **Kept** movement-speed/ETA calculation out of the HUD because current Retail can expose movement speed as a protected/secret value. Distance remains map-position based, avoiding the taint issue while still providing the useful yard count.\n\n* **Kept** Guide Mode progression, quest-frequency tabs, Azeroth Questing Network protocol, research payloads, Companion handoff, Website behavior, and Azeroth Questing Server schema unchanged. No Companion, Website, or server build is required for this addon-only visual/navigation change.\n\n*Beta 15 still requires in-game validation. Verify the green arrow is visible and rotates toward a known quest destination, an active quest shows its current unfinished objective when WoW exposes one, available/turn-in wording is correct, distance remains sensible, Shift-drag positioning still works, and no Lua/taint errors occur. No successful Beta 15 in-game test is claimed yet.*\n\n---\n\n'''
          changelog.write_text(heading + entry + old[len(heading):])
          PY

          luac -p NavigationHUD.lua
          find . -type f -name '*.lua' -not -path './.git/*' -print0 | xargs -0 -n1 luac -p
          git diff --check

          rm -f .github/workflows/prepare-beta15-navigation-style.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release addon v0.3.0-beta.15'
          git push origin HEAD:main
